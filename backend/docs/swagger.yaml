            additionalProperties:
              type: string
            type: object
        "404":
          description: Guest not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete guest
      tags:
      - Guest
    get:
      consumes:
      - application/json
      description: Get a single guest by its ID
      parameters:
      - description: Guest ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_guest.GuestResponse'
        "404":
          description: Guest not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get guest by ID
      tags:
      - Guest
    put:
      consumes:
      - application/json
      description: Update an existing guest's information
      parameters:
      - description: Guest ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Update guest request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_guest.UpdateGuestRequest'
      produces:
