# Pintu masuk tunggal VPS: TLS dan routing berdasarkan domain ke stack prod/staging.
#   docker network create edge
#   docker compose -p wedding-edge --env-file deploy/.env.edge -f deploy/edge.compose.yaml up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    pids_limit: 100
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN:?isi PROD_DOMAIN}
      STAGING_DOMAIN: ${STAGING_DOMAIN:?isi STAGING_DOMAIN}
      # Opsional: IP yang boleh masuk tanpa lewat Cloudflare (lihat edge.Caddyfile), mis. "203.0.113.7/32".
      EXTRA_ALLOWED_IPS: ${EXTRA_ALLOWED_IPS:-127.0.0.1/32}
    volumes:
      - ./edge.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
