# Satu stack lengkap (postgres + api + web). Dipakai untuk produksi dan staging:
#   docker compose -p wedding-prod    --env-file deploy/.env.prod    -f deploy/stack.compose.yaml up -d --build
#   docker compose -p wedding-staging --env-file deploy/.env.staging -f deploy/stack.compose.yaml up -d --build
# Variabel ada di deploy/.env.stack.example. Jaringan `edge` dibuat sekali: docker network create edge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD}
      POSTGRES_DB: wedding
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://wedding:${POSTGRES_PASSWORD}@postgres:5432/wedding
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?isi PUBLIC_ORIGIN, mis. https://contoh.com}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      APP_VERSION: ${APP_VERSION:-dev}
      LOG_LEVEL: info
      MEDIA_DIR: /data/media
      # /u/KODE disajikan API agar WhatsApp dan Instagram melihat tag pratinjau tautan.
      WEB_INDEX_URL: http://web/index.html
    volumes:
      - media:/data/media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Cadangan terjadwal ke R2 (database + foto). Hanya jalan dengan --profile backup, jadi staging
  # tanpa kredensial R2 tidak ikut. Lihat docs/backup.md.
  backup:
    profiles: ["backup"]
    build:
      context: ..
      dockerfile: deploy/backup/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wedding:${POSTGRES_PASSWORD}@postgres:5432/wedding
      MEDIA_DIR: /data/media
      BACKUP_DEST: ${BACKUP_DEST:-}  # wajib bila layanan ini dijalankan, mis. r2:nama-bucket/prod
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      # Remote rclone bernama "r2", dikonfigurasi lewat variabel lingkungan.
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - media:/data/media:ro
    healthcheck:
      # Sehat bila cadangan berhasil dalam dua kali selang ditambah 30 menit terakhir.
      test:
        - CMD-SHELL
        - 'test -n "$$(find /tmp/backup-ok -mmin -$$(( $${BACKUP_INTERVAL_HOURS:-6} * 120 + 30 )) 2>/dev/null)"'
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 15m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      default:
      edge:
        # nama yang dipakai edge Caddy: prod-web / staging-web
        aliases:
          - ${STACK_NAME:?isi STACK_NAME, mis. prod atau staging}-web

volumes:
  pgdata:
  media:

networks:
  edge:
    external: true
