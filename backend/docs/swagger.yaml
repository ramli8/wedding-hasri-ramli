      tags:
      - Guest
  /guests/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete a guest by its ID
      parameters:
      - description: Guest ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
